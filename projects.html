
<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>网络请求练习</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Microsoft YaHei", Arial, sans-serif;
    }
    body {
      background: linear-gradient(135deg, #ffffff 0%, #eaf4ff 100%);
      color: #333;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 40px 20px;
    }
    .container {
      width: 100%;
      max-width: 600px;
      background: #fff;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(22, 119, 255, 0.1);
    }
    nav {
      margin-bottom: 30px;
    }
    nav a {
      margin-right: 12px;
      text-decoration: none;
      color: #1677ff;
      font-size: 14px;
    }
    nav a:hover {
      text-decoration: underline;
    }
    h2 {
      color: #1677ff;
      margin-bottom: 10px;
    }
    p {
      margin-bottom: 20px;
      color: #555;
    }
    .blue-btn {
      background-color: #1677ff;
      color: #fff;
      border: none;
      padding: 9px 18px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      transition: 0.2s;
    }
    .blue-btn:hover {
      background-color: #4096ff;
    }
    .blue-btn:active {
      background-color: #0958d9;
    }
    input {
      padding: 8px 12px;
      border: 1px solid #91caff;
      border-radius: 6px;
      outline: none;
      font-size: 14px;
      width: 220px;
      margin-right: 8px;
      background: #fff;
    }
    input:focus {
      border-color: #1677ff;
      box-shadow: 0 0 0 2px rgba(22, 119, 255, 0.2);
    }
    #res404 {
      margin-top: 12px;
      color: #ff4d4f;
    }
    #list {
      margin-top: 18px;
      background: #fff;
      padding: 16px;
      border-radius: 10px;
      box-shadow: 0 2px 12px rgba(22, 119, 255, 0.08);
    }
    #list div {
      padding: 8px 12px;
      border-bottom: 1px solid #e6f4ff;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }
    #list div:last-child {
      border-bottom: none;
    }
    .del-btn {
      background-color: #ff4d4f;
      padding: 5px 12px;
      font-size: 12px;
      border: none;
      border-radius: 4px;
      color: white;
      cursor: pointer;
    }
    .del-btn:hover {
      background-color: #ff7875;
    }
    .edit-btn {
      background-color: #52c41a;
      padding: 5px 12px;
      font-size: 12px;
      border: none;
      border-radius: 4px;
      color: white;
      cursor: pointer;
    }
    .edit-btn:hover {
      background-color: #73d13d;
    }
    #msgBox {
      margin-top: 16px;
      font-size: 14px;
    }
    #tipEdit {
      margin-top: 8px;
      color: #666;
    }
    .err {
      color: #ff4d4f;
    }
    .success {
      color: #52c41a;
    }
  </style>
</head>
<body>
  <div class="container">
    <nav>
      <a href="index.html">首页</a >
      <a href="projects.html">网络请求练习</a >
      <a href="chat.html">AI待办助手</a >
    </nav>

    <h2>网络请求练习</h2>
    <p>点击按钮，测试一次不存在的文件请求。</p >
    <button class="blue-btn" onclick="test404()">测试404请求</button>
    <div id="res404"></div>

    <h3 style="margin:30px 0 10px;">增删查改列表</h3>
    <input id="inp" placeholder="输入内容">
    <button class="blue-btn" onclick="add()">新增一条</button>
    <button class="blue-btn" onclick="query()">查询/重试</button>
    <div id="tipEdit"></div>

    <div id="list"></div>
    <div id="msgBox"></div>
  </div>

  <script>
    let editIndex = null;

    // 转义，防止特殊字符破坏 onclick
    function escapeHtml(str) {
      return String(str)
        .replace(/&/g,"&amp;")
        .replace(/'/g,"\\'")
        .replace(/"/g,"&quot;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;");
    }

    function test404(){
      fetch("not-exist-file.html")
      .then(r=>{
        document.getElementById("res404").innerText = "请求失败：状态码 " + r.status;
      })
    }

    function showMsg(text, isOk){
      const box = document.getElementById("msgBox")
      box.innerText = text
      box.className = isOk ? "success" : "err"
    }

    function query(){
      fetch("/api/get")
      .then(res=>res.json())
      .then(arr=>{
        if(!Array.isArray(arr)) arr = [];
        let html = "";
        arr.forEach((item,idx)=>{
          const safeItem = escapeHtml(item);
          html += `<div>${safeItem}
            <div>
              <button class="edit-btn" onclick="startEdit(${idx}, '${safeItem}')">修改</button>
              <button class="del-btn" onclick="del(${idx})">删除</button>
            </div>
          </div>`
        })
        document.getElementById("list").innerHTML = html;
      })
      .catch(e=>{
        showMsg("请求失败：" + e.message, false)
      })
    }

    function add(){
      const inp = document.getElementById("inp")
      const val = inp.value.trim();
      if(editIndex !== null){
        fetch("/api/edit",{
          method:"POST",
          headers:{"Content-Type":"application/json"},
          body:JSON.stringify({index:editIndex, text:val})
        })
        .then(r=>r.json())
        .then(res=>{
          if(res.ok){
            showMsg(res.msg, true)
            query()
            inp.value = ""
            editIndex = null
            document.getElementById("tipEdit").innerText = ""
          }else{
            showMsg(res.msg, false)
          }
        })
        return;
      }
      fetch("/api/add",{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({text:val})
      })
      .then(r=>r.json())
      .then(res=>{
        if(res.ok){
          showMsg(res.msg, true)
          query()
          inp.value = ""
        }else{
          showMsg(res.msg, false)
        }
      })
    }

    function startEdit(i, text){
      editIndex = i
      document.getElementById("inp").value = text
      document.getElementById("tipEdit").innerText = "正在修改，点击新增保存"
    }

    function del(index){
      fetch("/api/del",{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({index})
      })
      .then(r=>r.json())
      .then(res=>{
        if(res.ok){
          showMsg(res.msg, true)
        }else{
          showMsg(res.msg, false)
        }
        query()
      })
    }
  </script>
</body>
</html>
