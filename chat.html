
<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>AI待办助手</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Microsoft YaHei", Arial, sans-serif;
    }
    body {
      background: linear-gradient(135deg, #ffffff 0%, #eaf4ff 100%);
      color: #333;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 40px 20px;
    }
    .container {
      width: 100%;
      max-width: 600px;
      background: #fff;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(22, 119, 255, 0.1);
    }
    nav {
      margin-bottom: 30px;
    }
    nav a {
      margin-right: 12px;
      text-decoration: none;
      color: #1677ff;
      font-size: 14px;
    }
    nav a:hover {
      text-decoration: underline;
    }
    .log-box {
      width: 100%;
      height: 80px;
      border: 1px solid #ccc;
      padding: 8px;
      margin-bottom:12px;
      border-radius:6px;
    }
    .chat-area{
      margin-bottom:20px;
    }
    .msg-item{
      padding:10px;
      background:#f5faff;
      margin:8px 0;
      border-radius:8px;
    }
    .input-wrap{
      display:flex;
      gap:8px;
    }
    #chatInput{
      flex-grow:1;
      padding:10px;
      border:1px solid #91caff;
      border-radius:6px;
      font-size:14px;
    }
    .blue-btn{
      background:#1677ff;
      color:white;
      border:none;
      padding:10px 18px;
      border-radius:6px;
      cursor:pointer;
    }
    .gray-btn{
      background:#888;
      color:white;
      border:none;
      padding:10px 18px;
      border-radius:6px;
      cursor:pointer;
    }
  </style>
</head>
<body>
  <div class="container">
    <nav>
      <a href="index.html">首页</a>
      <a href="projects.html">网络请求练习</a>
      <a href="chat.html">AI待办助手</a>
    </nav>

    <div class="log-box" id="toolLog">工具调用日志：</div>
    <div class="chat-area" id="chatBox"></div>

    <div class="input-wrap">
      <input id="chatInput" placeholder="对我说：帮我加一条明天交实验报告 / 查询我的待办 / 删除第1条待办">
      <button class="blue-btn" id="sendBtn">发送</button>
      <button class="gray-btn" id="stopBtn">停止生成</button>
    </div>
  </div>

  <script>
    const chatInput = document.getElementById('chatInput');
    const sendBtn = document.getElementById('sendBtn');
    const stopBtn = document.getElementById('stopBtn');
    const chatBox = document.getElementById('chatBox');
    const toolLog = document.getElementById('toolLog');
    let eventSource = null;

    sendBtn.onclick = function () {
      const text = chatInput.value.trim();
      if (!text) return;
      chatInput.value = '';
      toolLog.innerText = '工具调用日志：触发本地工具：查询待办';
      addMsg(text, 'user');

      if (eventSource) eventSource.close();
      eventSource = new EventSource(`/chat?content=${encodeURIComponent(text)}`);
      let dom = addMsg('', 'ai');

      eventSource.onmessage = function (e) {
        if (e.data === '[DONE]') {
          eventSource.close();
          return;
        }
        dom.innerText += e.data;
      }
    }

    stopBtn.onclick = function () {
      if (eventSource) eventSource.close();
    }

    function addMsg(content, type) {
      const div = document.createElement('div');
      div.className = 'msg-item';
      div.innerText = content;
      chatBox.appendChild(div);
      chatBox.scrollTop = chatBox.scrollHeight;
      return div;
    }
  </script>
</body>
</html>
